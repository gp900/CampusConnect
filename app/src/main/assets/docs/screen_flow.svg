<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
    <!-- Definitions for Arrowheads and Drop Shadows -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#1D4ED8" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100% " height="100%" fill="#F8FAFC" />

    <!-- Title -->
    <text x="500" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">Campus Connect: Screen Navigation Flow</text>

    <!-- Path Lines (Drawn first so they sit behind boxes) -->
    <!-- Splash -> Onboarding -->
    <line x1="500" y1="120" x2="500" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <!-- Onboarding -> Auth Router -->
    <line x1="500" y1="210" x2="500" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />

    <!-- Auth Router to Login / Register -->
    <path d="M 500 270 L 500 300 L 350 300 L 350 320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <path d="M 500 270 L 500 300 L 650 300 L 650 320" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />

    <!-- Login/Register -> Dashboard -->
    <path d="M 350 370 L 350 400 L 500 400 L 500 420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <path d="M 650 370 L 650 400 L 500 400 L 500 420" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />

    <!-- Dashboard -> Bottom Navigation Branches -->
    <path d="M 500 470 L 500 520 L 200 520 L 200 550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <path d="M 500 470 L 500 550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <path d="M 500 470 L 500 520 L 800 520 L 800 550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />

    <!-- Dashboard -> Notifications (Top Right floating branch) -->
    <path d="M 575 445 L 750 445 L 750 400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />

    <!-- Academics -> Inner Tabs -->
    <line x1="200" y1="600" x2="200" y2="640" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <!-- Campus -> Inner Tabs -->
    <line x1="500" y1="600" x2="500" y2="640" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <!-- Profile -> Logout back to Login -->
    <path d="M 800 600 L 800 700 L 920 700 L 920 345 L 725 345" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
    <text x="860" y="690" font-family="Arial, sans-serif" font-size="12" fill="#EF4444" font-weight="bold">Logout</text>

    <!-- BOXES -->

    <!-- Entry Point: Splash -->
    <rect x="425" y="70" width="150" height="50" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="500" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Splash Activity</text>

    <!-- Onboarding -->
    <rect x="425" y="160" width="150" height="50" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="500" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Onboarding Flow</text>

    <!-- Auth Router Logic (Diamond) -->
    <polygon points="500,230 520,250 500,270 480,250" fill="#FDE047" stroke="#EAB308" stroke-width="2" />
    <text x="540" y="255" font-family="Arial, sans-serif" font-size="12" fill="#64748b">isLoggedIn?</text>

    <!-- Login & Register -->
    <rect x="275" y="320" width="150" height="50" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="350" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Login Activity</text>

    <rect x="575" y="320" width="150" height="50" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="650" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Register Activity</text>

    <!-- Main Dashboard (Home) -->
    <rect x="425" y="420" width="150" height="50" rx="8" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <text x="500" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Main Dashboard</text>
    <text x="500" y="460" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">(Home Fragment)</text>

    <!-- Notifications Activity (Side branch) -->
    <rect x="675" y="350" width="150" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="750" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Notification Center</text>
    <text x="750" y="390" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(Full Activity)</text>

    <!-- Bottom Navigation Branches -->
    <!-- 1. Academics Hub -->
    <rect x="125" y="550" width="150" height="50" rx="8" fill="white" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)" />
    <text x="200" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Academics Hub</text>
    <text x="200" y="590" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Bottom Nav Tab 2</text>

    <rect x="100" y="640" width="200" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4" />
    <text x="200" y="660" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Timetables</text>
    <text x="200" y="675" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Attendance Tracker</text>
    <text x="200" y="690" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Assignment Manager</text>
    <text x="200" y="705" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Notes Sharing</text>

    <!-- 2. Campus Hub -->
    <rect x="425" y="550" width="150" height="50" rx="8" fill="white" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)" />
    <text x="500" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Campus Hub</text>
    <text x="500" y="590" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Bottom Nav Tab 3</text>

    <rect x="380" y="640" width="240" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4" />
    <text x="500" y="660" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Campus Maps (SVG Viewer)</text>
    <text x="500" y="675" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Event &amp; RSVP System</text>
    <text x="500" y="690" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Lost &amp; Found Reporter</text>
    <text x="500" y="705" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Clubs &amp; Announcements</text>
    <text x="500" y="720" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">• Student Complaint System</text>

    <!-- 3. Profile Module -->
    <rect x="725" y="550" width="150" height="50" rx="8" fill="white" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Profile &amp; Settings</text>
    <text x="800" y="590" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Bottom Nav Tab 4</text>

</svg>
